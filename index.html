<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYPERCOLOR ASTEROIDS</title>
<!-- What a shared link renders as. Read by crawlers and nothing else: the page
     itself never fetches any of it, so GR2 is untroubled and the cabinet still
     opens from a USB stick with the wifi off. The absolute URL is the one the
     book is published at; from file:// these lines simply go unread. -->
<meta name="description" content="A neon vector arcade game in one page. Two pilots, one screen, no build step and no dependencies.">
<meta property="og:title" content="HYPERCOLOR ASTEROIDS">
<meta property="og:description" content="A neon vector arcade game in one page. Two pilots, one screen, no build step and no dependencies.">
<meta property="og:image" content="https://durchnull.github.io/hypercolor-asteroids/media/field.png">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/crt.css">
<link rel="stylesheet" href="styles/hud.css">
<link rel="stylesheet" href="styles/overlay.css">
<link rel="stylesheet" href="styles/logo.css">
<link rel="stylesheet" href="styles/lobby.css">
<link rel="stylesheet" href="styles/pilot.css">
<link rel="stylesheet" href="styles/board.css">
<link rel="stylesheet" href="styles/book.css">
<link rel="stylesheet" href="styles/about.css">
<link rel="stylesheet" href="styles/face.css">
<link rel="stylesheet" href="styles/touch.css">
<link rel="stylesheet" href="styles/debrief.css">
</head>
<body>

<!-- The shell, and only the shell. Everything with a number or a name in it is
     filled in by a module that owns it: the HUD panels and the seat cards come
     from the seat list, and the field guide comes from the features themselves.
     See docs/ARCHITECTURE.md. -->

<canvas id="game"></canvas>
<div class="crt vignette"></div>
<div class="crt scanlines"></div>
<div class="crt roll"></div>

<div class="hud" id="hud"></div>

<!-- The splash reads left to right: the field on one side, the people on the
     other, and the way out of the cabinet underneath both. The deck is what
     scrolls; the dock never does, because the one thing on this screen you
     have to be able to find is the instruction to start. -->
<div class="overlay splash" id="start">
  <!-- The logo fills itself in, out of src/ui/logo.js, which is also where the
       tab icon comes from: one drawing of the name, in one file. -->
  <h1 class="logo" data-logo aria-label="Hypercolor Asteroids"></h1>

  <div class="deck">
    <section class="brief" aria-label="Field guide">
      <h2 data-ico="radar">FIELD GUIDE</h2>
      <ul id="guide"></ul>
    </section>

    <section class="pilot" id="pilot" aria-label="Pilot profile"></section>

    <section class="lobby" aria-label="Seats">
      <h2 data-ico="stick">SEATS &mdash; JOIN ANY TIME</h2>
      <div class="seats" id="seats"></div>
      <p class="lobbynote">
        Two pilots, one screen. Player two can drop in mid-wave, and anyone who
        runs out of lives can buy back in &mdash; joining is never refused.
      </p>
    </section>

    <!-- The board, and the way out of the cabinet into the book. Both are
         filled in by the module that owns them, out of docs/chronicle.js if
         this clone has ever built it. See src/ui/board.js, src/ui/book.js. -->
    <section class="board" id="board" aria-label="The flight records"></section>

    <section class="book" id="book" aria-label="The chronicle"></section>

    <!-- The last panel on the deck, and the only one that is not reading
         something: what this machine is, for whoever walked up to it without
         a repository open. See src/ui/about.js. -->
    <section class="about" id="about" aria-label="What this is"></section>
  </div>

  <div class="dock">
    <div class="controls">
      <b>P</b> pause &nbsp; <b>M</b> sound &nbsp; <b>ESC</b> quit
    </div>
    <div class="prompt" id="startPrompt">PRESS ENTER TO START</div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <h1>GAME OVER</h1>
  <div class="final">
    SCORE <span id="finalScore">0</span><br>
    <span class="best">BEST <span id="bestScore">0</span></span>
  </div>
  <section class="debrief" id="debrief" aria-label="Black box" hidden></section>
  <div class="prompt" id="overPrompt">PRESS ENTER</div>
</div>

<div class="touch" id="touch"></div>

<button id="mute" aria-label="Toggle sound">PRESS FOR SOUND</button>

<script src="src/boot.js"></script>
</body>
</html>
