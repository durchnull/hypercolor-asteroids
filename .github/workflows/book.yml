# The book, after something lands on main.
#
# Every landing leaves docs/ a commit out of date. On one machine that is fine:
# the post-commit hook rebuilds into the working tree and the pages ride along
# with whatever the pilot commits next. With several people merging pull
# requests there is no next commit to ride, and src/game/ledger.js is worse
# than stale - if every branch carries its own copy, every branch conflicts
# with every other one over a file nobody is allowed to edit by hand anyway.
#
# So the book is rebuilt here, once, after the merge. Nobody's branch has to
# carry it and nobody has to resolve it.
#
# **It arrives as a pull request, like everything else.** main takes pull
# requests and nothing else now (GR7), and the honest reading of that is that
# it holds for the machines too - a rule the machinery is exempt from is a rule
# with a door in it, and the door would be the one place nobody is watching.
# So the crew branches, files and opens a pull request, which is exactly what a
# pilot does with one difference: nobody has to read it.
#
# **It no longer merges its own.** main asks for one approval now, and an
# approval is a thing a person gives. There is no arrangement that ends with
# the crew pressing its own button either: the GitHub Actions integration
# cannot be a bypass actor on a user-owned repository, which was true when this
# file first said so and is now the reason the last step is missing rather than
# a footnote about a road not taken. The owner presses it. The cost is that the
# book sits stale between the landing and the click, which is the same
# staleness this workflow exists to fix, shortened from permanent to however
# long somebody takes to notice.
#
# Three things keep this honest:
#
#   - It only ever commits generated files. tools/chronicle.sh and
#     tools/tally.sh both derive everything they write from the history, so
#     this can be re-run at any time by anybody and arrives at the same answer.
#     GR12 is not bent by a machine running the generator; it would be bent by
#     a machine writing a number the history does not support, and it cannot.
#   - The book passes over its own filing in silence, so these commits get no
#     version, no chapter and no mention. They are the paperwork the chronicle
#     already declines to narrate - and now so are the pull requests.
#   - It opens nothing but its own, and only ever one. The pull request has a
#     single commit in it, written four lines earlier. If a landing arrives
#     before anybody has pressed merge, the crew closes the older one on its
#     way past: each of these is generated from the whole history, so the
#     newest supersedes every earlier one outright, and a queue of them would
#     conflict with each other over docs/ and src/game/ledger.js - which is the
#     mess this workflow was written to prevent.
#
# The loop closes on its own. Somebody merging the paperwork is a push to main
# like any other and starts this workflow again, but the book it rebuilds is
# the one that just landed, so the diff is empty and the run exits four lines
# in. Github's own rule - that nothing done with the default GITHUB_TOKEN
# triggers another run - used to be what stopped this, and is now only the
# reason the crew's pull request arrives with no referee and no flight strip on
# it.
#
# tools/chronicle-art.sh is not called here and could not do anything if it
# were - the plates need credentials that live in one person's untracked .env
# (GR2), and without them it exits quietly.

name: the book

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: the-book
  cancel-in-progress: false

jobs:
  rebuild:
    name: rewrite the chronicle and the ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: rebuild
        run: |
          sh tools/chronicle.sh
          sh tools/tally.sh
          sh tools/badges.sh

      - name: file it, if anything actually moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "the book was already up to date."
            exit 0
          fi

          # A name that says what it is: the crew that files the paperwork
          # after a landing and has never flown anything. It never becomes a
          # pilot either - the roster and the flight meter only count commits
          # that moved the game, and this one by construction never does.
          #
          # It signed as "the book" until this line changed, which read oddly:
          # the book is the thing being filed, not the hand filing it. Those
          # commits are in the history for good, so the filters that keep a
          # machine off the roster still answer to both names.
          git config user.name  "Ground Crew"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The run id, because two of these must never collide and a date
          # would. The branch outlives the merge by no time at all.
          BRANCH="ground-crew/$GITHUB_RUN_ID"
          SUBJECT="The paperwork from $(git rev-parse --short HEAD), filed"

          git switch -q -c "$BRANCH"
          git add -A
          git status --short

          # --no-verify would be a confession anywhere a pilot was typing it
          # (GR10). Here there is nothing to confess to and nothing to skip:
          # the hooks are not installed on a runner, because nobody ran
          # --install. The referee has already read this push, one commit at a
          # time, on the pull request that produced it.
          git commit -q -m "$SUBJECT"
          git push -q -u origin "$BRANCH"

          # Through a file, because the body is markdown and a heredoc indented
          # to sit inside this block hands github a wall of leading spaces,
          # which markdown reads as one long code block.
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          ```
                ___
              _/ o \__      .        the crew, filing
              \_____/ `-.        .
                 |  |    `.                    .
                 `--'      *
          ```

          Generated. `tools/chronicle.sh` and `tools/tally.sh` were run over
          the history that just landed, and whatever came out different is in
          here.

          Nobody needs to read it. The book passes over its own filing in
          silence, so this is not a version, earns no chapter and gets no
          plate. It arrives as a pull request because main takes pull requests
          and nothing else (GR7) — and a rule the machines are exempt from is a
          rule with a door in it.

          **Somebody has to press merge.** main asks for an approval now, and
          the crew cannot give itself one — so the book stays as it was until
          this lands. If another version arrives first, this one is closed and
          a newer one takes its place; the paperwork is always regenerated from
          the whole history, so nothing is lost by letting it go.
          EOF

          gh pr create --base main --head "$BRANCH" \
                       --title "$SUBJECT" --body-file "$RUNNER_TEMP/body.md"

          # Older paperwork, closed after the new one exists rather than
          # before: a run that fails to open its own leaves the previous one
          # standing, which is a stale book rather than no book at all.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ground-crew/")) | "\(.number) \(.headRefName)"' \
          | while read -r old ref; do
              if [ "$ref" != "$BRANCH" ]; then
                gh pr close "$old" --delete-branch \
                  --comment "Superseded by the paperwork from a later landing."
              fi
            done

          echo "filed. the book is on the board and lands when somebody merges it."
